<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AYMEN EL KHALFANI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0b0b;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            display: block;
            width: 100%;

            padding: 17px 20px;

            background: #151515;
            border: 1px solid #292929;
            border-radius: 14px;

            color: white;
            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        .link:hover {
            background: #202020;
            border-color: #444;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 45px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AYMEN EL KHALFANI</h1>

        <div class="links">

            <a
                class="link"
                href="https://www.linkedin.com/in/el-khalfani-aymen-b79582366"
                target="_blank"
                rel="noopener noreferrer">
                LinkedIn
            </a>

            <a
                class="link"
                href="https://open.spotify.com/user/31344jdimyilx62xwaz44oz6sxkm"
                target="_blank"
                rel="noopener noreferrer">
                Spotify
            </a>

            <a
                class="link"
                href="https://boxd.it/eN7cD"
                target="_blank"
                rel="noopener noreferrer">
                Letterboxd
            </a>

        </div>

        <footer>
            © 2026 AYMEN EL KHALFANI
        </footer>

    </div>

</body>
